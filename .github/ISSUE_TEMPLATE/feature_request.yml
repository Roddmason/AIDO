name: Feature request
description: Propose a focused improvement to AIDO.
title: "[feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Keep requests scoped. Do not include secrets, private workspace snapshots, or raw provider prompts.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the smallest useful implementation.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety And Local-First Impact
      description: Note credential, policy, approval, workspace, privacy, or migration risks.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What tests or behaviors prove this is done?
