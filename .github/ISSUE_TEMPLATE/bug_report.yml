name: Bug report
description: Report a reproducible defect in AIDO.
title: "[bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include secrets, API keys, provider tokens, local database contents, or private prompt dumps.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What broke?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction Steps
      description: Minimal local steps that reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Local Verification
      description: Commands run and relevant sanitized output.
      placeholder: uv run pytest tests_py -q
