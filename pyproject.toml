[project]
name = "local-control-center"
version = "0.1.0"
description = "Windows-native Python backend for the Local Control Center."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
	"fastapi>=0.136.0",
	"keyring>=25.0.0",
	"uvicorn>=0.37.0",
	"numpy>=1.26.0",
]

[project.optional-dependencies]
agents = ["openai-agents>=0.4.0"]
faiss = ["faiss-cpu>=1.13.0"]
otel = [
	"opentelemetry-sdk>=1.30.0",
	"opentelemetry-exporter-otlp-proto-http>=1.30.0",
]
dev = [
	"ruff>=0.15,<0.16",
	"pre-commit>=4.5.0",
	"pip-licenses>=5.5.0",
	"semgrep>=1.145.0",
]
test = ["pytest>=9.0.0", "httpx>=0.28.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests_py"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [
	"node_modules",
	"local-control-center/dist",
]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
select = [
	"E",
	"F",
	"B",
	"I",
	"UP",
	"SIM",
	"C4",
	"PERF",
	"RUF",
	"ARG",
	"RET",
	"D",
]
ignore = [
	"E501",
	# Docstrings de API publica AHORA EXIGIDAS (D101 clases, D102 metodos, D103 funciones):
	# ver docs/development/documentation-standard.md y test_source_documentation_headers.py.
	# Se mantienen fuera D105/D106/D107 (magic methods, nested classes, __init__): su
	# docstring suele ser redundante con la clase/contrato y añadiria ruido.
	"D105",
	"D106",
	"D107",
	# ARG002 (unused-method-argument): la mayoria son args exigidos por contrato
	# (overrides de urllib, protocolos de provider/runtime); el resto son args de firmas
	# publicas estables aceptados-pero-no-usados cuyos callers los pasan por keyword
	# (p.ej. prepare_model_call), no fallos de deteccion. Renombrar a _x romperia esos
	# callers. Se conserva el resto de ARG (ARG001/003/004/005) para codigo muerto real.
	"ARG002",
	# SIM118/SIM401: el repo usa sqlite3.Row, que soporta row[key] y row.keys() pero
	# NO `key in row` (itera valores) ni row.get(). Estas simplificaciones rompen los
	# row_to_* (AttributeError: 'sqlite3.Row' object has no attribute 'get'). Unsafe aqui.
	"SIM118",
	"SIM401",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Tests: sin docstrings de contrato, args de fixtures sin usar, sin presupuesto perf
# ni disciplina de ClassVar.
"tests_py/**" = ["ARG", "D", "PERF", "RUF012"]
# Migraciones: SQL embebido, sin docstrings de API.
"local_control_center/shared/migrations.py" = ["D"]
# Scripts/utilidades: sin docstrings de API publica.
"scripts/**" = ["D"]
"local-control-center/scripts/**" = ["D"]
