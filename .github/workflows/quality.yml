# Puerta de calidad en CI. Replica scripts/quality-local.ps1 en runners Linux: el gate local es
# PowerShell y no corre en GitHub, asi que aqui se invocan los mismos comandos portables.
# El job web-e2e va aparte porque la suite Playwright levanta un dashboard propio por chunk y
# tarda decenas de minutos; separarlo da senal rapida del resto sin esperar a los navegadores.
name: Quality

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONFAULTHANDLER: '1'

jobs:
  backend:
    name: Backend (ruff + pytest + guardrails)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Productive truth scanner
        run: uv run python scripts/productive-truth-scan.py

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Architecture guardrails
        run: >
          uv run pytest tests_py/test_real_readiness_architecture.py
          tests_py/test_internal_mock_product_boundary.py
          tests_py/test_execution_boundary_architecture.py
          tests_py/test_vertical_slices_architecture.py
          tests_py/test_web_rework_architecture.py -q

      - name: Python tests
        run: uv run pytest tests_py -q

  frontend:
    name: Frontend (biome + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm exec biome check local-control-center/web

      - name: Web typecheck
        run: pnpm run typecheck:web

      - name: Frontend build
        run: pnpm run build:web

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: local-control-center/dist/web
          retention-days: 7

  security:
    name: Security (gitleaks + semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks --no-git escanea el arbol, pero el historial completo permite auditar
          # un hallazgo sin volver a clonar.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Secret scan
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact

      - name: SAST
        run: >
          uv run semgrep scan --config .semgrep.yml --no-git-ignore
          local_control_center tests_py local-control-center/web/src tests_web

  web-e2e:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Web tests
        # El runner levanta un dashboard Python por chunk; --no-sandbox es necesario en el
        # contenedor del runner.
        env:
          PLAYWRIGHT_NO_SANDBOX: '1'
        run: pnpm run test:web

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: .tmp/playwright-artifacts-*
          retention-days: 7
