title = "AIDO secrets policy"

[extend]
useDefault = true

[[allowlists]]
description = "Installed third-party dependencies, including nested worktree vendors"
paths = ['''(?:^|[/\\])(?:\.venv|node_modules)[/\\]''']

[[allowlists]]
description = "Exact invalid PEM used by the redaction regression test"
targetRules = ["private-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|[/\\])tests_py[/\\]test_redaction\.py$''']
regexes = ['''^\x2d\x2d\x2d\x2d\x2dBEGIN RSA PRIVATE KEY\x2d\x2d\x2d\x2d\x2d\\n"\r?\n        "MIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQDfake000\\n"\r?\n        "abcDEF123456789secretkeymaterialthatmustnotleak==\\n"\r?\n        "\x2d\x2d\x2d\x2d\x2dEND RSA PRIVATE KEY\x2d\x2d\x2d\x2d\x2d$''']

[[allowlists]]
description = "Audited credential_refs snapshot checksums"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = [
  '''(?:^|[/\\])\.tmp/aido\-runtime\-evidence/2026\-09\-20/jev\-remediation\-restart\.json$''',
  '''(?:^|[/\\])\.tmp/aido\-runtime\-evidence/2026\-09\-20/jev\-selection\-copy\-restart\.json$''',
  '''(?:^|[/\\])\.tmp/aido\-runtime\-evidence/2026\-09\-20/remediation\-display\-restart\.json$''',
  '''(?:^|[/\\])\.tmp/aido\-runtime\-evidence/2026\-09\-20/resource\-policy\-copy\-restart\.json$''',
  '''(?:^|[/\\])\.tmp/aido\-runtime\-evidence/2026\-09\-20/resource\-policy\-restart\.json$''',
  '''(?:^|[/\\])\.tmp/aido\-runtime\-evidence/2026\-09\-21/automatic\-risk\-defaults\-restart\.json$''',
  '''(?:^|[/\\])\.tmp/aido\-runtime\-evidence/2026\-09\-21/automatic\-runtime\-defaults\-restart\.json$''',
  '''(?:^|[/\\])\.tmp/aido\-runtime\-evidence/2026\-09\-21/local\-gpu\-admission\-restart\.json$''',
  '''(?:^|[/\\])\.tmp/aido\-runtime\-evidence/2026\-09\-21/research\-legacy\-snapshot\-restart\.json$''',
  '''(?:^|[/\\])\.tmp/aido\-runtime\-evidence/2026\-09\-21/research\-resolution\-restart\.json$''',
  '''(?:^|[/\\])\.tmp/aido\-runtime\-evidence/2026\-09\-21/runtime\-risk\-review\-restart\.json$''',
  '''(?:^|[/\\])\.tmp/aido\-runtime\-evidence/2026\-09\-21/runtime\-risk\-transaction\-restart\.json$''',
  '''(?:^|[/\\])\.tmp/aido\-runtime\-evidence/2026\-09\-21/timeout\-nested\-restart\.json$''',
]
regexes = ['''(?i)^["']?credential_refs["']?\s*:\s*["']?(?:b8907969d135aea3b6d793ec88f6a12e19b4432cf5b29307be2807ea02d58101)["']?$''']

